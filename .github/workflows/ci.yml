name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >=20.11, so 20 is the floor we promise; 24 is
        # the current active LTS. Every version we claim to support runs here.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # build only joins src; this also typechecks the test files.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The tarball is what users install, so the tarball is what CI runs.
      - name: Smoke test the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls repropack-*.tgz | head -n 1)
          if [ ! -f "$TARBALL" ]; then echo "npm pack produced nothing" >&2; exit 1; fi

          # --- package contents ---
          # Run from the repo root, before any cd: npm pack packs the package
          # in the current directory, so doing this after moving to a throwaway
          # directory would inspect that empty package instead of ours and
          # always pass.
          npm pack --dry-run --json > pack-meta.json
          node -e "
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('pack-meta.json', 'utf8'));
          const files = meta[0].files.map((f) => f.path);
          const dist = files.filter((p) => p.startsWith('dist/'));
          const problems = [];
          if (!files.includes('dist/index.js')) problems.push('dist/index.js is missing from the tarball');
          if (!files.includes('dist/index.d.ts')) problems.push('dist/index.d.ts is missing, so the types do not ship');
          // repropack's bin lives in dist/cli/index.js, not dist/cli.js.
          if (!files.includes('dist/cli/index.js')) problems.push('dist/cli/index.js is missing from the tarball');
          if (dist.length === 0) problems.push('the tarball has no dist/ entries at all');
          for (const bad of ['tests/', 'src/', 'node_modules/']) {
            if (files.some((p) => p.startsWith(bad))) problems.push('the tarball leaks ' + bad);
          }
          if (files.some((p) => p.endsWith('.js.map'))) problems.push('the tarball ships .js.map files that point at sources it does not contain');
          if (problems.length > 0) { console.error(problems.join('\n')); process.exit(1); }
          console.log('package contents ok: ' + files.length + ' entries, ' + dist.length + ' under dist/');
          "

          # --- the installed artifact ---
          # Install into a throwaway directory and run every assertion from
          # there, so node resolves repropack to node_modules (the packed
          # artifact) and never to the checkout.
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # Compare against package.json, not just "did it exit 0": a broken
          # entry guard makes the CLI exit 0 having printed nothing.
          expected=$(node -p "require('./node_modules/repropack/package.json').version")
          actual=$(./node_modules/.bin/repropack --version)
          echo "repropack --version = $actual (expected $expected)"
          [ "$actual" = "$expected" ] || { echo "version mismatch" >&2; exit 1; }

          # The CLI working says nothing about the library. Import the packed
          # entry point and assert the public surface is actually reachable.
          node --input-type=module -e "
          const m = await import('repropack');
          const names = Object.keys(m);
          if (names.length === 0) { console.error('repropack exports nothing'); process.exit(1); }
          for (const required of ['capture', 'replay', 'verifyBundle', 'readBundle', 'packBundle']) {
            if (typeof m[required] !== 'function') {
              console.error('missing library export: ' + required);
              process.exit(1);
            }
          }
          console.log('library import ok, ' + names.length + ' exports');
          "
